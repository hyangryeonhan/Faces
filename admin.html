<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Faces</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* 블록 에디터 */
    .editor-wrap {
      margin-bottom: 2rem;
    }

    .block-text textarea {
      width: 100%;
      min-height: 140px;
      padding: 0.75rem;
      border: 1px solid #e8e8e4;
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-primary);
      resize: vertical;
      outline: none;
      border-radius: 0;
      -webkit-appearance: none;
    }

    .block-text textarea:focus {
      border-color: var(--text-primary);
    }

    .insert-photo-btn {
      display: block;
      width: 100%;
      padding: 0.5rem;
      margin: 6px 0;
      background: none;
      border: 1px dashed #d9d9d9;
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-size: 12px;
      color: #b0b0b0;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .insert-photo-btn:hover {
      border-color: #999;
      color: #666;
    }

    .block-photo {
      border: 1px solid #e8e8e4;
      padding: 1rem;
      margin: 6px 0;
      background: #fafafa;
      position: relative;
    }

    .block-photo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .block-photo-preview {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      display: block;
      margin: 0.5rem 0;
      background: var(--photo-bg);
    }

    .block-date-input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ddddd9;
      background: #fff;
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      margin-top: 0.5rem;
      border-radius: 0;
      -webkit-appearance: none;
    }

    .block-date-input:focus {
      border-color: var(--text-primary);
    }

    .block-date-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.75rem;
      display: block;
    }
  </style>
</head>
<body>

  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://kjdvxxuadtaiszdixfdw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZHZ4eHVhZHRhaXN6ZGl4ZmR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MzkwMTgsImV4cCI6MjEwMTExNTAxOH0.qvfKLMazqQJfMDoK6BbaTbquZZJlHJXzQJEWnRgPffE';
    const ADMIN_PASSWORD = 'Faces_password';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 블록: [{type:'text', content:''}, {type:'photo', url:'', date:'', file:null}]
    let blocks = [];
    let editingId = null;
    let isLoggedIn = sessionStorage.getItem('faces_admin') === '1';

    function init() {
      if (!isLoggedIn) renderLogin();
      else renderAdmin();
    }

    /* ── 로그인 ── */
    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <div class="admin-login">
          <div class="login-box">
            <h2>Faces Admin</h2>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="pw" placeholder="비밀번호 입력" />
            </div>
            <button class="btn btn-primary" onclick="login()">로그인</button>
            <p id="login-err" class="status-msg error" style="display:none;">비밀번호가 틀렸습니다.</p>
          </div>
        </div>
      `;
      document.getElementById('pw').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
      });
    }

    function login() {
      const pw = document.getElementById('pw').value;
      if (pw === ADMIN_PASSWORD) {
        sessionStorage.setItem('faces_admin', '1');
        isLoggedIn = true;
        renderAdmin();
      } else {
        document.getElementById('login-err').style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('faces_admin');
      isLoggedIn = false;
      renderLogin();
    }

    /* ── 어드민 메인 ── */
    function renderAdmin(editPost = null) {
      editingId = editPost ? editPost.id : null;
      const isEdit = !!editPost;

      // 기존 글이면 블록 포맷으로 변환
      if (isEdit) {
        blocks = toBlocks(editPost.slides || []);
      } else {
        blocks = [{ type: 'text', content: '' }];
      }

      document.getElementById('app').innerHTML = `
        <div class="admin-page">
          <h2>
            ${isEdit ? '글 편집' : '새 글 작성'}
            <div style="display:flex;gap:0.5rem;">
              ${isEdit ? `<button class="btn btn-sm" onclick="renderAdmin()">취소</button>` : ''}
              <button class="btn btn-sm" onclick="logout()">로그아웃</button>
            </div>
          </h2>

          <div class="form-group">
            <label>글 제목</label>
            <input type="text" id="post-title" placeholder="제목을 입력하세요"
              value="${isEdit ? escapeHtml(editPost.title) : ''}" />
          </div>

          <div class="editor-wrap" id="editor-wrap"></div>

          <div>
            <button class="btn btn-primary" onclick="publish()">
              ${isEdit ? '저장하기' : '발행하기'}
            </button>
            <span id="publish-status" class="status-msg" style="margin-left: 1rem;"></span>
          </div>

          <div class="post-list" id="post-list"></div>
        </div>
      `;

      renderEditor();
      loadPostList();
    }

    /* ── 블록 변환: 구 포맷 → 새 포맷 ── */
    function toBlocks(slides) {
      if (!slides.length) return [{ type: 'text', content: '' }];
      // 이미 새 포맷이면 그대로
      if (slides[0].type) return slides.map(b => ({ ...b }));
      // 구 포맷 변환 (photo_url, date, body)
      const result = [];
      for (const s of slides) {
        result.push({ type: 'text', content: s.body || '' });
        if (s.photo_url) result.push({ type: 'photo', url: s.photo_url, date: s.date || '', file: null });
      }
      // 마지막이 photo면 빈 text 추가
      if (result[result.length - 1]?.type === 'photo') {
        result.push({ type: 'text', content: '' });
      }
      return result;
    }

    /* ── 에디터 렌더 ── */
    function renderEditor() {
      const wrap = document.getElementById('editor-wrap');
      if (!wrap) return;

      wrap.innerHTML = '';

      blocks.forEach((block, i) => {
        if (block.type === 'text') {
          // 텍스트 블록
          const div = document.createElement('div');
          div.className = 'block-text';
          div.dataset.idx = i;

          const ta = document.createElement('textarea');
          ta.placeholder = '글을 작성하세요...';
          ta.value = block.content;
          ta.addEventListener('input', () => { blocks[i].content = ta.value; });
          div.appendChild(ta);

          // 사진 삽입 버튼 (텍스트 블록 아래)
          const addBtn = document.createElement('button');
          addBtn.className = 'insert-photo-btn';
          addBtn.textContent = '+ 사진 추가';
          addBtn.addEventListener('click', () => insertPhotoAfter(i));
          div.appendChild(addBtn);

          wrap.appendChild(div);

        } else if (block.type === 'photo') {
          // 사진 블록
          const div = document.createElement('div');
          div.className = 'block-photo';
          div.dataset.idx = i;

          div.innerHTML = `
            <div class="block-photo-header">
              <span>사진</span>
              <button class="btn btn-danger" onclick="removeBlock(${i})">삭제</button>
            </div>
            <input type="file" accept="image/*" />
            ${block.url ? `<img class="block-photo-preview" src="${block.url}" />` : `<img class="block-photo-preview" style="display:none;" />`}
            <span class="block-date-label">날짜 (예: 16 07 10)</span>
            <input class="block-date-input" type="text" placeholder="YY MM DD" value="${escapeHtml(block.date || '')}" />
          `;

          const fileInput = div.querySelector('input[type="file"]');
          const preview = div.querySelector('.block-photo-preview');
          const dateInput = div.querySelector('.block-date-input');

          fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            blocks[i].file = file;
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
          });

          dateInput.addEventListener('input', () => {
            blocks[i].date = dateInput.value;
          });

          wrap.appendChild(div);
        }
      });
    }

    /* ── 사진 블록 삽입 (텍스트 블록 i 뒤에) ── */
    function insertPhotoAfter(idx) {
      // idx 텍스트 블록 뒤에 photo + text 삽입
      blocks.splice(idx + 1, 0,
        { type: 'photo', url: '', date: '', file: null },
        { type: 'text', content: '' }
      );
      renderEditor();
    }

    /* ── 블록 삭제 (photo + 이후 빈 text 함께 제거) ── */
    function removeBlock(idx) {
      // photo 블록 제거
      blocks.splice(idx, 1);
      // 앞뒤 text 블록이 연속되면 합치지 않고 그냥 둠
      // 단, 블록이 없으면 기본 text 하나 추가
      if (blocks.length === 0) blocks.push({ type: 'text', content: '' });
      renderEditor();
    }

    /* ── 발행 / 저장 ── */
    async function publish() {
      const title = document.getElementById('post-title')?.value.trim();
      const statusEl = document.getElementById('publish-status');

      if (!title) {
        statusEl.textContent = '제목을 입력해주세요.';
        statusEl.className = 'status-msg error';
        return;
      }

      const hasPhoto = blocks.some(b => b.type === 'photo' && (b.url || b.file));
      if (!hasPhoto) {
        statusEl.textContent = '사진을 최소 1장 추가해주세요.';
        statusEl.className = 'status-msg error';
        return;
      }

      statusEl.textContent = '저장 중...';
      statusEl.className = 'status-msg';

      try {
        const savedBlocks = [];
        for (const block of blocks) {
          if (block.type === 'text') {
            savedBlocks.push({ type: 'text', content: block.content });
          } else if (block.type === 'photo') {
            let url = block.url;
            if (block.file) {
              const ext = block.file.name.split('.').pop();
              const fileName = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
              const { error: uploadErr } = await db.storage.from('photos').upload(fileName, block.file);
              if (uploadErr) throw uploadErr;
              const { data: { publicUrl } } = db.storage.from('photos').getPublicUrl(fileName);
              url = publicUrl;
            }
            if (url) savedBlocks.push({ type: 'photo', url, date: block.date });
          }
        }

        if (editingId) {
          const { error } = await db.from('posts').update({ title, slides: savedBlocks }).eq('id', editingId);
          if (error) throw error;
        } else {
          const { error } = await db.from('posts').insert({ title, slides: savedBlocks });
          if (error) throw error;
        }

        statusEl.textContent = editingId ? '저장 완료!' : '발행 완료!';
        statusEl.className = 'status-msg';
        setTimeout(() => renderAdmin(), 1200);

      } catch (err) {
        console.error(err);
        statusEl.textContent = '오류가 발생했습니다. 다시 시도해주세요.';
        statusEl.className = 'status-msg error';
      }
    }

    /* ── 글 목록 ── */
    async function loadPostList() {
      const listEl = document.getElementById('post-list');
      if (!listEl) return;
      const { data: posts, error } = await db
        .from('posts')
        .select('id, title, created_at, slides')
        .order('created_at', { ascending: false });

      if (error || !posts?.length) { listEl.innerHTML = ''; return; }

      listEl.innerHTML = `
        <h3>발행된 글 (${posts.length})</h3>
        ${posts.map(p => {
          const photoCount = (p.slides || []).filter(b => b.type === 'photo' || b.photo_url).length;
          return `
            <div class="post-list-item">
              <div>
                <div class="post-list-title">${escapeHtml(p.title)}</div>
                <div class="post-list-meta">사진 ${photoCount}장 · ${new Date(p.created_at).toLocaleDateString('ko-KR')}</div>
              </div>
              <div style="display:flex;gap:0.5rem;">
                <button class="btn btn-sm" onclick="startEdit('${p.id}')">편집</button>
                <button class="btn btn-danger" onclick="deletePost('${p.id}', this)">삭제</button>
              </div>
            </div>
          `;
        }).join('')}
      `;
    }

    async function startEdit(id) {
      const { data: post, error } = await db.from('posts').select('*').eq('id', id).single();
      if (error || !post) return;
      renderAdmin(post);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deletePost(id, btn) {
      if (!confirm('이 글을 삭제할까요?')) return;
      btn.disabled = true;
      btn.textContent = '...';
      const { error } = await db.from('posts').delete().eq('id', id);
      if (!error) loadPostList();
      else { btn.disabled = false; btn.textContent = '삭제'; }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    init();
  </script>
</body>
</html>
