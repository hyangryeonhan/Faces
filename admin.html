<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Faces</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .editor-outer {
      border: 1px solid #e8e8e4;
      margin-bottom: 1.5rem;
    }

    #post-editor {
      min-height: 400px;
      padding: 1.25rem;
      outline: none;
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.9;
      color: #1d1d1d;
      word-break: break-word;
    }

    #post-editor:empty::before {
      content: attr(data-placeholder);
      color: #c0c0c0;
      pointer-events: none;
    }

    .editor-toolbar {
      display: flex;
      align-items: center;
      padding: 0.6rem 1rem;
      border-top: 1px solid #e8e8e4;
      background: #fafafa;
    }

    .toolbar-btn {
      background: none;
      border: 1px solid #d9d9d9;
      padding: 0.35rem 0.85rem;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      font-family: 'Pretendard', inherit;
    }

    .toolbar-btn:hover {
      border-color: #999;
      color: #333;
    }

    /* 인라인 사진 블록 */
    .photo-block {
      display: block;
      margin: 1rem 0;
      border: 1px solid #e8e8e4;
      background: #fafafa;
      user-select: none;
      -webkit-user-select: none;
    }

    .photo-block img {
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      display: block;
    }

    .photo-block-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.85rem;
    }

    .photo-block-date {
      flex: 1;
      border: none;
      border-bottom: 1px solid #e8e8e4;
      background: transparent;
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-size: 13px;
      color: #1d1d1d;
      padding: 0.25rem 0;
      outline: none;
    }

    .photo-block-date::placeholder { color: #c0c0c0; }

    .photo-block-del {
      background: none;
      border: 1px solid #e0b0b0;
      color: #c0392b;
      font-size: 11px;
      padding: 0.25rem 0.6rem;
      cursor: pointer;
      font-family: inherit;
      flex-shrink: 0;
    }

    .photo-block-del:hover { background: #fde; }
  </style>
</head>
<body>
  <div id="app"></div>
  <input type="file" id="photo-file-input" accept="image/*" style="display:none;" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://kjdvxxuadtaiszdixfdw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZHZ4eHVhZHRhaXN6ZGl4ZmR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MzkwMTgsImV4cCI6MjEwMTExNTAxOH0.qvfKLMazqQJfMDoK6BbaTbquZZJlHJXzQJEWnRgPffE';
    const ADMIN_PASSWORD = 'Faces_password';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let editingId = null;
    let savedRange = null;           // 커서 위치 저장
    const pendingFiles = new Map();  // blockId → File
    let thumbnailFile = null;        // 썸네일 파일
    let thumbnailUrl = '';           // 기존 썸네일 URL

    let isLoggedIn = sessionStorage.getItem('faces_admin') === '1';

    function init() {
      if (!isLoggedIn) renderLogin();
      else renderList();
    }

    /* ── 로그인 ── */
    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <div class="admin-login">
          <div class="login-box">
            <h2>Faces Admin</h2>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="pw" placeholder="비밀번호 입력" />
            </div>
            <button class="btn btn-primary" onclick="login()">로그인</button>
            <p id="login-err" class="status-msg error" style="display:none;">비밀번호가 틀렸습니다.</p>
          </div>
        </div>
      `;
      document.getElementById('pw').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
      });
    }

    function login() {
      const pw = document.getElementById('pw').value;
      if (pw === ADMIN_PASSWORD) {
        sessionStorage.setItem('faces_admin', '1');
        isLoggedIn = true;
        renderList();
      } else {
        document.getElementById('login-err').style.display = 'block';
      }
    }

    /* ── 글 목록 화면 (기본 홈) ── */
    async function renderList() {
      document.getElementById('app').innerHTML = `
        <div class="admin-page">
          <h2>
            발행된 글
            <div style="display:flex;gap:0.5rem;">
              <button class="btn btn-primary btn-sm" onclick="renderAdmin()">+ 새 글 작성</button>
              <button class="btn btn-sm" onclick="logout()">로그아웃</button>
            </div>
          </h2>
          <div id="post-list-main"><p class="status-msg">불러오는 중...</p></div>
        </div>
      `;

      const { data: posts, error } = await db
        .from('posts')
        .select('id, title, created_at, slides')
        .order('created_at', { ascending: false });

      const listEl = document.getElementById('post-list-main');
      if (error || !posts?.length) {
        listEl.innerHTML = '<p class="status-msg">아직 작성된 글이 없습니다.</p>';
        return;
      }

      listEl.innerHTML = posts.map(p => {
        const photoCount = (p.slides || []).filter(b => b.type === 'photo' || b.photo_url).length;
        return `
          <div class="post-list-item">
            <div>
              <div class="post-list-title">${escapeHtml(p.title)}</div>
              <div class="post-list-meta">사진 ${photoCount}장 · ${new Date(p.created_at).toLocaleDateString('ko-KR')}</div>
            </div>
            <div style="display:flex;gap:0.5rem;">
              <button class="btn btn-sm" onclick="startEdit('${p.id}')">편집</button>
              <button class="btn btn-danger" onclick="deletePost('${p.id}', this)">삭제</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function logout() {
      sessionStorage.removeItem('faces_admin');
      isLoggedIn = false;
      renderLogin();
    }

    /* ── 에디터 화면 ── */
    function renderAdmin(editPost = null) {
      editingId = editPost ? editPost.id : null;
      pendingFiles.clear();
      thumbnailFile = null;
      thumbnailUrl = '';
      const isEdit = !!editPost;

      document.getElementById('app').innerHTML = `
        <div class="admin-page">
          <h2>
            ${isEdit ? '글 편집' : '새 글 작성'}
            <div style="display:flex;gap:0.5rem;">
              <button class="btn btn-sm" onclick="renderList()">← 목록</button>
            </div>
          </h2>

          <div class="form-group">
            <label>썸네일</label>
            <div id="thumbnail-area" onclick="document.getElementById('thumb-input').click()" style="
              width:120px; height:120px; border:1px solid #ddddd9; cursor:pointer;
              display:flex; align-items:center; justify-content:center;
              background:#fafafa; overflow:hidden; position:relative;
            ">
              <img id="thumb-preview" style="width:100%;height:100%;object-fit:cover;display:none;" />
              <span id="thumb-placeholder" style="font-size:12px;color:#b0b0b0;">+ 이미지 선택</span>
            </div>
            <input type="file" id="thumb-input" accept="image/*" style="display:none;" onchange="handleThumbFile(this)" />
          </div>

          <div class="form-group">
            <label>글 제목</label>
            <input type="text" id="post-title" placeholder="제목을 입력하세요"
              value="${isEdit ? escapeAttr(editPost.title) : ''}" />
          </div>

          <div class="editor-outer">
            <div
              id="post-editor"
              contenteditable="true"
              data-placeholder="글을 작성하세요..."
            ></div>
            <div class="editor-toolbar">
              <button class="toolbar-btn" onclick="triggerPhoto()">+ 사진 추가</button>
            </div>
          </div>

          <div>
            <button class="btn btn-primary" onclick="publish()">
              ${isEdit ? '저장하기' : '발행하기'}
            </button>
            <span id="publish-status" class="status-msg" style="margin-left:1rem;"></span>
          </div>
        </div>
      `;

      // 편집 모드: 기존 데이터 에디터에 로드
      if (isEdit) {
        const raw = editPost.slides || [];
        // 썸네일 블록 분리
        const thumbBlock = raw.find(b => b.type === 'thumbnail');
        if (thumbBlock) {
          thumbnailUrl = thumbBlock.url;
          const prev = document.getElementById('thumb-preview');
          prev.src = thumbnailUrl;
          prev.style.display = 'block';
          document.getElementById('thumb-placeholder').style.display = 'none';
        }
        const blocks = normalizeBlocks(raw.filter(b => b.type !== 'thumbnail'));
        loadBlocksToEditor(blocks);
      }

      // 파일 인풋 이벤트
      const fileInput = document.getElementById('photo-file-input');
      fileInput.onchange = handlePhotoFile;

      // 에디터 포커스 시 커서 저장
      document.getElementById('post-editor').addEventListener('mouseup', saveRange);
      document.getElementById('post-editor').addEventListener('keyup', saveRange);
    }

    /* ── 썸네일 파일 선택 ── */
    function handleThumbFile(input) {
      const file = input.files[0];
      if (!file) return;
      thumbnailFile = file;
      thumbnailUrl = '';
      const prev = document.getElementById('thumb-preview');
      prev.src = URL.createObjectURL(file);
      prev.style.display = 'block';
      document.getElementById('thumb-placeholder').style.display = 'none';
    }

    /* ── 커서 저장 ── */
    function saveRange() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        savedRange = sel.getRangeAt(0).cloneRange();
      }
    }

    /* ── 사진 삽입 ── */
    function triggerPhoto() {
      saveRange(); // 버튼 클릭 전 커서 위치 저장
      document.getElementById('photo-file-input').value = '';
      document.getElementById('photo-file-input').click();
    }

    function handlePhotoFile() {
      const file = this.files[0];
      if (!file) return;

      const blockId = `pb-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      pendingFiles.set(blockId, file);
      const previewUrl = URL.createObjectURL(file);

      const block = makePhotoBlock(blockId, previewUrl, '', '');
      insertBlockAtCursor(block);
    }

    function makePhotoBlock(blockId, previewUrl, existingUrl, date) {
      const wrap = document.createElement('div');
      wrap.contentEditable = 'false';
      wrap.className = 'photo-block';
      wrap.dataset.blockId = blockId;
      wrap.dataset.url = existingUrl;

      const img = document.createElement('img');
      img.src = previewUrl;
      wrap.appendChild(img);

      const controls = document.createElement('div');
      controls.className = 'photo-block-controls';

      const dateInput = document.createElement('input');
      dateInput.type = 'text';
      dateInput.className = 'photo-block-date';
      dateInput.placeholder = '날짜 (예: 16 07 10)';
      dateInput.value = date;

      const delBtn = document.createElement('button');
      delBtn.className = 'photo-block-del';
      delBtn.textContent = '삭제';
      delBtn.onclick = () => {
        wrap.remove();
        pendingFiles.delete(blockId);
      };

      controls.appendChild(dateInput);
      controls.appendChild(delBtn);
      wrap.appendChild(controls);

      return wrap;
    }

    function insertBlockAtCursor(block) {
      const editor = document.getElementById('post-editor');
      editor.focus();

      let range;
      if (savedRange) {
        // 저장된 커서가 에디터 안에 있는지 확인
        if (editor.contains(savedRange.commonAncestorContainer)) {
          range = savedRange;
        }
      }

      if (range) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        range.collapse(false);
        range.insertNode(block);
        // 사진 뒤에 줄바꿈 추가
        const br = document.createElement('br');
        block.after(br);
        // 커서를 br 뒤로
        const newRange = document.createRange();
        newRange.setStartAfter(br);
        newRange.collapse(true);
        sel.removeAllRanges();
        sel.addRange(newRange);
        savedRange = newRange.cloneRange();
      } else {
        // 커서 없으면 맨 끝에 추가
        editor.appendChild(block);
        const br = document.createElement('br');
        editor.appendChild(br);
      }
    }

    /* ── 에디터 → 블록 배열 직렬화 ── */
    function serializeEditor() {
      const editor = document.getElementById('post-editor');
      const blocks = [];
      let textBuf = '';

      function flush() {
        const t = textBuf.replace(/^\n+|\n+$/g, ''); // trim newlines
        if (t) blocks.push({ type: 'text', content: t });
        textBuf = '';
      }

      function walk(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          textBuf += node.textContent;
        } else if (node.nodeName === 'BR') {
          textBuf += '\n';
        } else if (node.classList?.contains('photo-block')) {
          flush();
          const dateVal = node.querySelector('.photo-block-date')?.value || '';
          blocks.push({
            type: 'photo',
            url: node.dataset.url || '',
            date: dateVal,
            _file: pendingFiles.get(node.dataset.blockId) || null,
          });
        } else if (node.nodeName === 'DIV' || node.nodeName === 'P') {
          for (const child of node.childNodes) walk(child);
          textBuf += '\n';
        } else {
          for (const child of node.childNodes) walk(child);
        }
      }

      for (const child of editor.childNodes) walk(child);
      flush();
      return blocks;
    }

    /* ── 블록 배열 → 에디터 로드 ── */
    function loadBlocksToEditor(blocks) {
      const editor = document.getElementById('post-editor');
      editor.innerHTML = '';

      for (const block of blocks) {
        if (block.type === 'text') {
          const lines = block.content.split('\n');
          lines.forEach((line, i) => {
            editor.appendChild(document.createTextNode(line));
            if (i < lines.length - 1) editor.appendChild(document.createElement('br'));
          });
          editor.appendChild(document.createElement('br'));
        } else if (block.type === 'photo') {
          const blockId = `existing-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          const el = makePhotoBlock(blockId, block.url, block.url, block.date || '');
          editor.appendChild(el);
          editor.appendChild(document.createElement('br'));
        }
      }
    }

    /* ── 구 포맷 → 새 포맷 변환 ── */
    function normalizeBlocks(raw) {
      if (!raw.length) return [];
      if (raw[0].type) return raw;
      // 구 포맷: {photo_url, date, body}
      const result = [];
      for (const s of raw) {
        if (s.body) result.push({ type: 'text', content: s.body });
        if (s.photo_url) result.push({ type: 'photo', url: s.photo_url, date: s.date || '' });
      }
      return result;
    }

    /* ── 발행 / 저장 ── */
    async function publish() {
      const title = document.getElementById('post-title')?.value.trim();
      const statusEl = document.getElementById('publish-status');

      if (!title) {
        statusEl.textContent = '제목을 입력해주세요.';
        statusEl.className = 'status-msg error';
        return;
      }

      const rawBlocks = serializeEditor();
      const hasPhoto = rawBlocks.some(b => b.type === 'photo' && (b.url || b._file));
      if (!hasPhoto) {
        statusEl.textContent = '사진을 최소 1장 추가해주세요.';
        statusEl.className = 'status-msg error';
        return;
      }

      statusEl.textContent = '저장 중...';
      statusEl.className = 'status-msg';

      try {
        // 썸네일 업로드
        let finalThumbUrl = thumbnailUrl;
        if (thumbnailFile) {
          const ext = thumbnailFile.name.split('.').pop();
          const fileName = `thumb_${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
          const { error: tErr } = await db.storage.from('photos').upload(fileName, thumbnailFile);
          if (tErr) throw tErr;
          const { data: { publicUrl } } = db.storage.from('photos').getPublicUrl(fileName);
          finalThumbUrl = publicUrl;
        }

        const savedBlocks = [];
        // 썸네일 블록을 맨 앞에 저장
        if (finalThumbUrl) savedBlocks.push({ type: 'thumbnail', url: finalThumbUrl });

        for (const block of rawBlocks) {
          if (block.type === 'text') {
            savedBlocks.push({ type: 'text', content: block.content });
          } else if (block.type === 'photo') {
            let url = block.url;
            if (block._file) {
              const ext = block._file.name.split('.').pop();
              const fileName = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
              const { error: upErr } = await db.storage.from('photos').upload(fileName, block._file);
              if (upErr) throw upErr;
              const { data: { publicUrl } } = db.storage.from('photos').getPublicUrl(fileName);
              url = publicUrl;
            }
            if (url) savedBlocks.push({ type: 'photo', url, date: block.date });
          }
        }

        if (editingId) {
          const { error } = await db.from('posts').update({ title, slides: savedBlocks }).eq('id', editingId);
          if (error) throw error;
        } else {
          const { error } = await db.from('posts').insert({ title, slides: savedBlocks });
          if (error) throw error;
        }

        statusEl.textContent = editingId ? '저장 완료!' : '발행 완료!';
        statusEl.className = 'status-msg';
        setTimeout(() => renderList(), 1200);
      } catch (err) {
        console.error(err);
        statusEl.textContent = '오류가 발생했습니다.';
        statusEl.className = 'status-msg error';
      }
    }

    async function startEdit(id) {
      const { data: post, error } = await db.from('posts').select('*').eq('id', id).single();
      if (error || !post) return;
      renderAdmin(post);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deletePost(id, btn) {
      if (!confirm('이 글을 삭제할까요?')) return;
      btn.disabled = true; btn.textContent = '...';
      const { error } = await db.from('posts').delete().eq('id', id);
      if (!error) renderList();
      else { btn.disabled = false; btn.textContent = '삭제'; }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function escapeAttr(str) {
      return (str || '').replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
</html>
