<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faces</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── 상세 페이지 전용 ── */
    .sticky-header {
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 100;
    }

    .sticky-header .site-header {
      padding: 30px 64px 0;
      text-align: center;
      transition: padding 0.3s ease;
    }

    .sticky-header .site-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #d9d9d9;
      margin: 0;
      line-height: 30px;
    }

    .sticky-header .site-header p {
      font-size: 16px;
      font-weight: 400;
      color: #d9d9d9;
      line-height: 20px;
      margin: 0;
    }

    .sticky-header.scrolled .site-header {
      padding: 10px 64px 0;
    }

    .sticky-header .header-divider {
      margin: 20px 64px 0;
      transition: margin 0.3s ease;
    }

    .sticky-header.scrolled .header-divider {
      margin: 8px 64px 0;
    }

    .post-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 64px;
      transition: padding 0.3s ease;
    }

    .sticky-header.scrolled .post-nav {
      padding: 14px 64px;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #1d1d1d;
      padding: 0;
      font-family: inherit;
      line-height: 1;
      flex-shrink: 0;
    }

    .post-title-nav {
      font-size: 16px;
      font-weight: 400;
      color: #1d1d1d;
      text-align: center;
      flex: 1;
      padding: 0 24px;
    }

    /* ── 본문 ── */
    .post-body-wrap {
      display: flex;
      justify-content: center;
      padding: 0 64px 6rem;
    }

    .post-card {
      width: 100%;
      max-width: 1068px;
      border: 1px solid #d9d9d9;
      padding: 40px 254px 80px;
    }

    .slide-block {
      margin-bottom: 60px;
    }

    .slide-block:last-child {
      margin-bottom: 0;
    }

    .slide-text {
      font-size: 16px;
      line-height: 1.9;
      color: #1d1d1d;
      white-space: pre-wrap;
      margin-bottom: 30px;
    }

    .photo-container {
      position: relative;
      width: 100%;
    }

    .photo-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .date-stamp {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-family: 'VT323', monospace;
      font-size: 22px;
      color: #e8890c;
      text-shadow: 0 0 10px rgba(232, 137, 12, 0.5);
      letter-spacing: 3px;
      pointer-events: none;
      line-height: 1;
    }

    @media (max-width: 1200px) {
      .post-card { padding: 40px 10% 80px; }
    }

    @media (max-width: 768px) {
      /* 타이틀 헤더 */
      .sticky-header .site-header { padding: 20px 20px 0; }
      .sticky-header.scrolled .site-header { padding: 8px 20px 0; }
      .sticky-header .site-header h1 {
        font-size: 16px;   /* 20 × 0.8 */
        line-height: 24px;
      }
      .sticky-header .site-header p {
        font-size: 13px;   /* 16 × 0.8 */
        line-height: 16px;
      }
      .sticky-header .header-divider,
      .sticky-header.scrolled .header-divider { margin: 10px 20px 0; }
      .post-nav,
      .sticky-header.scrolled .post-nav { padding: 12px 20px; }
      .post-title-nav {
        font-size: 13px;   /* 16 × 0.8 */
      }
      /* 본문 카드 */
      .post-body-wrap { padding: 0 20px 4rem; }
      .post-card { padding: 20px 20px 32px; }
      .slide-text {
        font-size: 13px;
        line-height: 24px;
        margin-bottom: 16px;
      }
      .slide-block { margin-bottom: 36px; }
      .date-stamp {
        font-size: 16px;   /* 22 × 0.8 → 18, 줄여서 16 */
      }
    }
  </style>
</head>
<body>

  <div class="sticky-header" id="stickyHeader">
    <header class="site-header">
      <h1>faces</h1>
      <p>till we have faces</p>
    </header>
    <div class="header-divider"></div>
    <nav class="post-nav">
      <button class="back-btn" onclick="history.back()">←</button>
      <span class="post-title-nav" id="navTitle"></span>
      <span class="nickname-tag">Haleyn</span>
    </nav>
  </div>

  <div class="post-body-wrap">
    <div class="post-card" id="postCard">
      <p style="color:#d9d9d9; font-size:14px;">불러오는 중...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://kjdvxxuadtaiszdixfdw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZHZ4eHVhZHRhaXN6ZGl4ZmR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MzkwMTgsImV4cCI6MjEwMTExNTAxOH0.qvfKLMazqQJfMDoK6BbaTbquZZJlHJXzQJEWnRgPffE';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function init() {
      const id = new URLSearchParams(location.search).get('id');
      const card = document.getElementById('postCard');

      if (!id) {
        card.innerHTML = '<p style="color:#d9d9d9;font-size:14px;">글을 찾을 수 없습니다.</p>';
        return;
      }

      const { data: post, error } = await db
        .from('posts')
        .select('*')
        .eq('id', id)
        .single();

      if (error || !post) {
        card.innerHTML = '<p style="color:#d9d9d9;font-size:14px;">글을 찾을 수 없습니다.</p>';
        return;
      }

      document.title = `${post.title} — Faces`;
      document.getElementById('navTitle').textContent = post.title;

      const raw = post.slides || [];
      if (raw.length === 0) {
        card.innerHTML = '<p style="color:#d9d9d9;font-size:14px;">내용이 없습니다.</p>';
        return;
      }

      // 구 포맷({photo_url,date,body}) → 새 포맷({type}) 변환
      const blocks = raw[0].type ? raw : raw.flatMap(s => {
        const out = [];
        if (s.body) out.push({ type: 'text', content: s.body });
        if (s.photo_url) out.push({ type: 'photo', url: s.photo_url, date: s.date || '' });
        return out;
      });

      card.innerHTML = blocks.map(block => {
        if (block.type === 'thumbnail') return ''; // 썸네일은 표시 안 함
        if (block.type === 'text') {
          return block.content
            ? `<p class="slide-text">${escapeHtml(block.content)}</p>`
            : '';
        } else if (block.type === 'photo') {
          return `
            <div class="photo-container">
              <img src="${block.url}" alt="${escapeHtml(post.title)}" loading="lazy" />
              ${block.date ? `<span class="date-stamp">${escapeHtml(block.date)}</span>` : ''}
            </div>
          `;
        }
        return '';
      }).join('');
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // 스크롤 시 헤더 compact 전환
    const stickyHeader = document.getElementById('stickyHeader');
    window.addEventListener('scroll', () => {
      stickyHeader.classList.toggle('scrolled', window.scrollY > 60);
    }, { passive: true });

    init();
  </script>
</body>
</html>
